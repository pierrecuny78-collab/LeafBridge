name: Build LeafBridge APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python syntax check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Termux engine
        run: python -m py_compile termux/leafbridge_engine.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeafBridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
